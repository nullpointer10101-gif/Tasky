    <script>
      (function() {
        function initAdexium() {
          if (window.AdexiumWidget && !window._adexiumInstance) {
            try {
              window._adexiumInstance = new window.AdexiumWidget({
                wid: 'e93d690f-bdc3-4ed5-8d9f-8f208afa3774',
                adFormat: 'interstitial'
              });
              window._adexiumInstance.autoMode();
              console.log('[Adexium] Interstitial initialized in autoMode');

              // Trigger immediate interstitial on bot open
              setTimeout(function() {
                try {
                  window._adexiumInstance.autoFetchAd();
                } catch(e) {
                  console.warn('[Adexium] Startup ad error:', e);
                }
              }, 1200);
            } catch (e) {
              console.error('[Adexium] Init error:', e);
            }
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initAdexium);
        } else {
          initAdexium();
        }
        window.addEventListener('load', initAdexium);
      })();
    </script>

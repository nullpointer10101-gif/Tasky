    <script type="text/javascript">
      window.initAdexiumGlobal = function() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
        } catch(e) {}

        if (typeof AdexiumWidget !== 'undefined' && !window.adexiumWidget) {
          try {
            console.log('[AdManager] 🚀 Instantiating AdexiumWidget...');
            const adexiumWidget = new AdexiumWidget({
              wid: 'e93d690f-bdc3-4ed5-8d9f-8f208afa3774',
              adFormat: 'push-like'
            });
            
            // Set up permanent global event handlers
            if (typeof adexiumWidget.on === 'function') {
              adexiumWidget.on('adReceived', function(ad) {
                console.log('[AdManager] 📩 Global Event: adReceived', ad);
                window._adexiumLastAd = ad;
                window._adexiumAdReceivedAt = Date.now();
                try {
                  if (typeof adexiumWidget.displayAd === 'function') {
                    adexiumWidget.displayAd(ad);
                    console.log('[AdManager] ✅ Global displayAd() executed!');
                  }
                } catch(err) {
                  console.error('[AdManager] Global displayAd() error:', err);
                }
              });

              adexiumWidget.on('noAdFound', function() {
                console.warn('[AdManager] ⚠️ Global Event: noAdFound');
                window._adexiumNoAdFound = true;
                window._adexiumNoAdAt = Date.now();
              });

              adexiumWidget.on('adClosed', function() {
                console.log('[AdManager] 🏁 Global Event: adClosed');
                window._adexiumAdClosedAt = Date.now();
              });
            }

            if (typeof adexiumWidget.autoMode === 'function') {
              adexiumWidget.autoMode();
            }

            window.adexiumWidget = adexiumWidget;
            window._adexiumInstance = adexiumWidget;
            console.log('[AdManager] ✅ AdexiumWidget initialized globally!', adexiumWidget);
          } catch(e) {
            console.error('[AdManager] ❌ AdexiumWidget global init error:', e);
          }
        }
      };

      document.addEventListener('DOMContentLoaded', function() {
        if (window.initAdexiumGlobal) window.initAdexiumGlobal();
      });
    </script>
